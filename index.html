<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4A90E2">
<title>키워드 검색량 체커</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    padding: 24px 14px 60px;
    min-height: 100vh;
    background: linear-gradient(180deg, #4A90E2 0%, #F2F5F9 220px);
    font-family: 'Malgun Gothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: #222;
  }
  .container { max-width: 720px; margin: 0 auto; }
  h1 {
    text-align: center;
    color: #fff;
    font-size: 1.7rem;
    margin: 8px 0 6px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .subtitle {
    text-align: center;
    color: rgba(255,255,255,0.9);
    font-size: 0.95rem;
    margin: 0 0 22px;
  }
  .searchBox {
    display: flex;
    gap: 8px;
    background: #fff;
    border-radius: 16px;
    padding: 10px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.10);
    margin-bottom: 12px;
  }
  .searchBox input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 1.1rem;
    padding: 10px 8px;
    min-width: 0;
  }
  .searchBox button {
    background: #4A90E2;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 0 20px;
    font-size: 1.05rem;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
  }
  .searchBox button:active { background: #3A7BC8; }
  .searchBox button:disabled { background: #aac4e6; }

  .notice {
    background: #FFF6E0;
    border: 1px solid #F2D98A;
    color: #7A5B00;
    font-size: 0.85rem;
    border-radius: 12px;
    padding: 10px 14px;
    margin-bottom: 18px;
    line-height: 1.5;
  }

  .toolbar {
    display: flex;
    justify-content: flex-end;
    margin-bottom: 8px;
  }
  .toolbar button {
    background: none;
    border: none;
    color: #888;
    font-size: 0.85rem;
    text-decoration: underline;
    cursor: pointer;
  }

  .card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    overflow: hidden;
  }
  .tableWrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 480px; }
  th, td { padding: 12px 10px; text-align: right; font-size: 0.95rem; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th {
    background: #F0F7FF;
    color: #4A6A8A;
    font-size: 0.82rem;
    font-weight: bold;
    position: sticky;
    top: 0;
  }
  tbody tr { border-top: 1px solid #F0F0F0; }
  tbody tr:active { background: #F7FAFF; }
  .kw { font-weight: bold; color: #222; }
  .total { color: #E2662E; font-weight: bold; }
  .muted { color: #bbb; font-size: 0.85rem; }
  .delBtn {
    background: none;
    border: none;
    color: #ccc;
    font-size: 1.1rem;
    cursor: pointer;
    padding: 0 4px;
  }
  .empty {
    text-align: center;
    color: #999;
    padding: 40px 20px;
    font-size: 0.95rem;
  }
  .errRow { color: #C0392B; font-size: 0.85rem; padding: 10px 14px; }

  .sectionTitle {
    color: #fff;
    font-size: 1.05rem;
    font-weight: bold;
    margin: 26px 0 10px 4px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.12);
  }
  .sectionTitle:first-of-type { margin-top: 0; }
  .catTabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 12px 12px 4px;
  }
  .catTab {
    flex-shrink: 0;
    background: #F0F7FF;
    color: #4A6A8A;
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 0.9rem;
    font-weight: bold;
    cursor: pointer;
    white-space: nowrap;
  }
  .catTab.active { background: #4A90E2; color: #fff; }
  .catHint { font-size: 0.8rem; color: #999; padding: 0 14px 10px; }
  .comp {
    display: inline-block;
    font-size: 0.75rem;
    font-weight: bold;
    padding: 2px 8px;
    border-radius: 10px;
  }
  .comp.high { background: #FDE8E6; color: #C0392B; }
  .comp.mid { background: #FFF3D6; color: #B9812F; }
  .comp.low { background: #E3F3E8; color: #2E9E5B; }
  tr.catRow { cursor: pointer; }
  tr.catRow td.kw { color: #4A90E2; }
  tr.relatedRow td { background: #F7FAFF; padding: 10px 14px; }
  .relatedList { display: flex; flex-direction: column; gap: 6px; }
  .relatedItem { display: flex; justify-content: space-between; font-size: 0.88rem; padding: 4px 0; }
  .relatedItem .rk { color: #444; }
  .relatedItem .rv { color: #E2662E; font-weight: bold; }
  .loadingRow { text-align: center; color: #999; padding: 20px; font-size: 0.9rem; }
</style>
</head>
<body>
<div class="container">
  <h1>🔍 키워드 검색량 체커</h1>
  <div class="subtitle">월간 검색량을 확인해서 글감 우선순위를 정하세요</div>

  <div class="searchBox">
    <input id="kwInput" type="text" placeholder="키워드 입력 (예: 에어컨필터청소)" autocomplete="off">
    <button id="searchBtn" onclick="runSearch()">확인</button>
  </div>

  <div id="errBox"></div>

  <div class="notice">
    ℹ️ 발행량은 네이버 자체 API 대신 <b>빙(Bing) 검색결과 개수</b>(site:blog.naver.com 기준)로 추정한 근사치예요. 정확한 공식 수치는 아니지만, 키워드 간 상대적인 경쟁 강도를 가늠하는 용도로 참고하세요.
  </div>

  <div class="sectionTitle">📊 카테고리별 인기 키워드</div>
  <div class="card" style="margin-bottom:20px;">
    <div class="catTabs" id="catTabs"></div>
    <div class="catHint">키워드를 누르면 연관 검색어 top 10이 펼쳐져요</div>
    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th>키워드</th>
            <th>경쟁도</th>
            <th>합계</th>
          </tr>
        </thead>
        <tbody id="catBody"></tbody>
      </table>
    </div>
  </div>

  <div class="sectionTitle">🔎 내가 확인한 키워드</div>
  <div class="toolbar">
    <button onclick="clearAll()">전체 지우기</button>
  </div>

  <div class="card">
    <div class="tableWrap">
      <table>
        <thead>
          <tr>
            <th>키워드</th>
            <th>PC</th>
            <th>모바일</th>
            <th>합계</th>
            <th>발행량</th>
            <th>블루오션지수</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="resultsBody"></tbody>
      </table>
    </div>
    <div id="emptyState" class="empty">아직 확인한 키워드가 없어요.<br>위에 키워드를 입력해보세요.</div>
  </div>
</div>

<script>
const API_BASE = "https://keyword-checker.rbwkdtkfkd.workers.dev";
const STORAGE_KEY = "keywordCheckerResults";

let results = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(results));
}

function fmt(n) {
  if (n === null || n === undefined) return "-";
  return n.toLocaleString("ko-KR");
}

function render() {
  const body = document.getElementById("resultsBody");
  const empty = document.getElementById("emptyState");
  const sorted = [...results].sort((a, b) => (b.totalSearch || 0) - (a.totalSearch || 0));

  if (sorted.length === 0) {
    body.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  body.innerHTML = sorted.map((r) => `
    <tr>
      <td class="kw">${escapeHtml(r.keyword)}</td>
      <td>${fmt(r.pcSearch)}</td>
      <td>${fmt(r.mobileSearch)}</td>
      <td class="total">${fmt(r.totalSearch)}</td>
      <td class="muted">${r.publishCount !== null && r.publishCount !== undefined ? fmt(r.publishCount) : "준비중"}</td>
      <td class="total">${r.ratio !== null && r.ratio !== undefined ? r.ratio.toFixed(1) : "-"}</td>
      <td><button class="delBtn" onclick="removeKeyword('${encodeURIComponent(r.keyword)}')">✕</button></td>
    </tr>
  `).join("");
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function removeKeyword(encodedKw) {
  const kw = decodeURIComponent(encodedKw);
  results = results.filter((r) => r.keyword !== kw);
  save();
  render();
}

function clearAll() {
  if (!confirm("전체 결과를 지울까요?")) return;
  results = [];
  save();
  render();
}

function showError(msg) {
  document.getElementById("errBox").innerHTML = msg ? `<div class="errRow">${escapeHtml(msg)}</div>` : "";
}

async function runSearch() {
  const input = document.getElementById("kwInput");
  const btn = document.getElementById("searchBtn");
  const keyword = input.value.trim();
  if (!keyword) return;

  showError("");
  btn.disabled = true;
  btn.textContent = "확인중...";

  try {
    const res = await fetch(`${API_BASE}/?q=${encodeURIComponent(keyword)}`);
    const data = await res.json();
    if (data.error) {
      showError(`조회 실패: ${data.error}`);
      return;
    }
    results = results.filter((r) => r.keyword !== data.keyword);
    results.push(data);
    save();
    render();
    input.value = "";
  } catch (e) {
    showError("네트워크 오류가 발생했어요. 잠시 후 다시 시도해주세요.");
  } finally {
    btn.disabled = false;
    btn.textContent = "확인";
  }
}

document.getElementById("kwInput").addEventListener("keydown", (e) => {
  if (e.key === "Enter") runSearch();
});

let currentCatId = null;
const relatedCache = {};
let openRelatedKeyword = null;

function compClass(compIdx) {
  if (compIdx === "높음") return "high";
  if (compIdx === "중간") return "mid";
  if (compIdx === "낮음") return "low";
  return "mid";
}

async function loadCategories() {
  try {
    const res = await fetch(`${API_BASE}/categories`);
    const data = await res.json();
    const tabsEl = document.getElementById("catTabs");
    tabsEl.innerHTML = (data.categories || []).map((c) => `
      <button class="catTab" data-id="${c.id}" onclick="loadCategory('${c.id}')">${escapeHtml(c.label)}</button>
    `).join("");
    if (data.categories && data.categories[0]) {
      loadCategory(data.categories[0].id);
    }
  } catch (e) {
    document.getElementById("catBody").innerHTML = `<tr><td colspan="3" class="loadingRow">카테고리를 불러오지 못했어요</td></tr>`;
  }
}

async function loadCategory(id) {
  currentCatId = id;
  openRelatedKeyword = null;
  document.querySelectorAll(".catTab").forEach((btn) => {
    btn.classList.toggle("active", btn.dataset.id === id);
  });
  const body = document.getElementById("catBody");
  body.innerHTML = `<tr><td colspan="3" class="loadingRow">불러오는 중...</td></tr>`;
  try {
    const res = await fetch(`${API_BASE}/category?id=${encodeURIComponent(id)}`);
    const data = await res.json();
    if (data.error) {
      body.innerHTML = `<tr><td colspan="3" class="loadingRow">${escapeHtml(data.error)}</td></tr>`;
      return;
    }
    renderCategoryRows(data.keywords || []);
  } catch (e) {
    body.innerHTML = `<tr><td colspan="3" class="loadingRow">불러오지 못했어요, 다시 시도해주세요</td></tr>`;
  }
}

function renderCategoryRows(keywords) {
  const body = document.getElementById("catBody");
  body.innerHTML = keywords.map((k) => `
    <tr class="catRow" onclick="toggleRelated('${encodeURIComponent(k.keyword)}')">
      <td class="kw">${escapeHtml(k.keyword)}</td>
      <td><span class="comp ${compClass(k.compIdx)}">${escapeHtml(k.compIdx || "-")}</span></td>
      <td class="total">${fmt(k.total)}</td>
    </tr>
    <tr class="relatedRow" id="related-${encodeURIComponent(k.keyword)}" style="display:none;">
      <td colspan="3"><div class="relatedList"></div></td>
    </tr>
  `).join("");
}

async function toggleRelated(encodedKw) {
  const kw = decodeURIComponent(encodedKw);
  const row = document.getElementById(`related-${encodedKw}`);
  if (!row) return;

  if (openRelatedKeyword === kw) {
    row.style.display = "none";
    openRelatedKeyword = null;
    return;
  }
  if (openRelatedKeyword) {
    const prevRow = document.getElementById(`related-${encodeURIComponent(openRelatedKeyword)}`);
    if (prevRow) prevRow.style.display = "none";
  }
  openRelatedKeyword = kw;
  row.style.display = "table-row";
  const listEl = row.querySelector(".relatedList");

  if (relatedCache[kw]) {
    renderRelatedList(listEl, relatedCache[kw]);
    return;
  }
  listEl.innerHTML = `<div class="loadingRow">연관 검색어 불러오는 중...</div>`;
  try {
    const res = await fetch(`${API_BASE}/related?q=${encodeURIComponent(kw)}`);
    const data = await res.json();
    if (data.error) {
      listEl.innerHTML = `<div class="loadingRow">${escapeHtml(data.error)}</div>`;
      return;
    }
    relatedCache[kw] = data.related || [];
    renderRelatedList(listEl, relatedCache[kw]);
  } catch (e) {
    listEl.innerHTML = `<div class="loadingRow">불러오지 못했어요</div>`;
  }
}

function renderRelatedList(listEl, related) {
  if (!related.length) {
    listEl.innerHTML = `<div class="loadingRow">연관 검색어가 없어요</div>`;
    return;
  }
  listEl.innerHTML = related.map((r) => `
    <div class="relatedItem"><span class="rk">${escapeHtml(r.keyword)}</span><span class="rv">${fmt(r.total)}</span></div>
  `).join("");
}

render();
loadCategories();
</script>
</body>
</html>
